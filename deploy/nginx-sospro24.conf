# SOSPro24 — sito statico (Vite). Il database è su Supabase, qui ci sono solo le pagine.
# Installato da deploy/setup-vps.sh in /etc/nginx/sites-available/sospro24.com
# Certbot aggiunge da solo le righe HTTPS (listen 443, certificati) e il redirect da http.
server {
    listen 80;
    listen [::]:80;
    server_name sospro24.com www.sospro24.com;

    root /var/www/sospro24;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Intestazioni di sicurezza (ereditate dalle location, che non usano add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # File con hash nel nome: si possono tenere in cache a lungo
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # App a pagina singola: ogni percorso apre index.html, sempre aggiornato
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
